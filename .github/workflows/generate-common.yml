# Shared generation job used by the three "Generate · ..." workflows.
# Callers assemble the CLI arguments; this runs the generator, writes the
# audit into the job summary, and uploads the stl + 3mf + png artifact.
name: generate (shared)

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      artifact:
        required: true
        type: string
      cli_args:
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt matplotlib

      - name: Generate
        env:                 # env indirection keeps inputs out of the script
          CLI_ARGS: ${{ inputs.cli_args }}
        run: |
          # tokens only - they become python argv entries, never shell code
          read -ra ARGS <<< "$CLI_ARGS"
          python -m flowerpot "${ARGS[@]}" --format both --preview --out out/ | tee report.txt

      - name: Write the job summary
        if: always()
        env:
          TITLE: ${{ inputs.title }}
        run: |
          {
            echo "## $TITLE"
            echo '```'
            cat report.txt 2>/dev/null || echo "generation failed - see the log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error
