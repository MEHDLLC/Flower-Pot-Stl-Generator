# Actions -> "Generate · self-watering set" -> Run workflow.
# Two pieces: outer reservoir pot with refill tube + funnel, inner wick-cup
# liner, rims flush. low_poly_faceted cannot host the tube, so it is not
# offered here. Fine-tuning (wick holes, wall gap, ...) via extra_args.
name: "Generate · self-watering set"

on:
  workflow_dispatch:
    inputs:
      pot_style:
        description: "Outer pot style"
        type: choice
        default: classic_tapered
        options: [classic_tapered, ribbed_spiral, hexagonal]
      surface_texture:
        description: "Outer surface texture"
        type: choice
        default: none
        options: [none, herringbone, honeycomb, diamonds, waves]
      color:
        description: "Color (palette name or #RRGGBB hex)"
        type: string
        default: terracotta
      printer:
        description: "Printer profile embedded in the .3mf"
        type: choice
        default: creality-k1-max
        options: [creality-k1-max, creality-k1, creality-ender3-v3-ke, none]
      height:
        description: "Height in mm"
        type: string
        default: "145"
      top_diameter:
        description: "Top diameter in mm"
        type: string
        default: "150"
      bottom_diameter:
        description: "Bottom diameter in mm"
        type: string
        default: "105"
      reservoir_height:
        description: "Water depth in mm"
        type: string
        default: "35"
      jar_greenhouse:
        description: "Jar seat in the inner pot (upside-down canning jar = greenhouse)"
        type: boolean
        default: false
      extra_args:
        description: "Extra CLI flags (see README)"
        type: string
        default: ""

jobs:
  set:
    uses: ./.github/workflows/generate-common.yml
    with:
      title: "Self-watering set: ${{ inputs.pot_style }}"
      artifact: "sw-${{ inputs.pot_style }}"
      cli_args: >-
        --self-watering
        --pot-style ${{ inputs.pot_style }}
        --surface-texture ${{ inputs.surface_texture }}
        --color ${{ inputs.color }}
        --printer ${{ inputs.printer }}
        --height ${{ inputs.height }}
        --top-diameter ${{ inputs.top_diameter }}
        --bottom-diameter ${{ inputs.bottom_diameter }}
        --reservoir-height ${{ inputs.reservoir_height }}
        ${{ inputs.jar_greenhouse && '--jar-greenhouse' || '' }}
        ${{ inputs.extra_args }}
