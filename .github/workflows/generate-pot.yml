# Actions -> "Generate · classic pot" -> Run workflow.
# The original pots: four styles, textures, drainage, optional drip saucer.
# Anything not on the form goes in extra_args exactly as on the CLI, e.g.
#   --wall-thickness 3.6 --rib-twist-degrees 60 --accent-color sand
name: "Generate · classic pot"

on:
  workflow_dispatch:
    inputs:
      pot_style:
        description: "Pot style"
        type: choice
        default: classic_tapered
        options: [classic_tapered, low_poly_faceted, ribbed_spiral, hexagonal, square]
      surface_texture:
        description: "Surface texture"
        type: choice
        default: none
        options: [none, herringbone, honeycomb, diamonds, waves]
      color:
        description: "Color (palette name or #RRGGBB hex)"
        type: string
        default: terracotta
      printer:
        description: "Printer profile embedded in the .3mf"
        type: choice
        default: creality-k1-max
        options: [creality-k1-max, creality-k1, creality-ender3-v3-ke, none]
      height:
        description: "Height in mm"
        type: string
        default: "145"
      top_diameter:
        description: "Top diameter in mm"
        type: string
        default: "150"
      bottom_diameter:
        description: "Bottom diameter in mm"
        type: string
        default: "105"
      drainage_pattern:
        description: "Drainage holes"
        type: choice
        default: ring
        options: [ring, center, grid, none]
      extras:
        description: "Extras"
        type: choice
        default: none
        options: [none, saucer, jar_greenhouse, saucer_and_jar]
      extra_args:
        description: "Extra CLI flags (see README)"
        type: string
        default: ""

jobs:
  pot:
    uses: ./.github/workflows/generate-common.yml
    with:
      title: "Classic pot: ${{ inputs.pot_style }}"
      artifact: "pot-${{ inputs.pot_style }}"
      cli_args: >-
        --pot-style ${{ inputs.pot_style }}
        --surface-texture ${{ inputs.surface_texture }}
        --color ${{ inputs.color }}
        --printer ${{ inputs.printer }}
        --height ${{ inputs.height }}
        --top-diameter ${{ inputs.top_diameter }}
        --bottom-diameter ${{ inputs.bottom_diameter }}
        --drainage-pattern ${{ inputs.drainage_pattern }}
        ${{ (inputs.extras == 'saucer' || inputs.extras == 'saucer_and_jar') && '--generate-saucer' || '' }}
        ${{ (inputs.extras == 'jar_greenhouse' || inputs.extras == 'saucer_and_jar') && '--jar-greenhouse' || '' }}
        ${{ inputs.extra_args }}
